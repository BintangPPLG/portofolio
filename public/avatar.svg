<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#8B93E8"/>
      <stop offset="55%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#18181F"/>
    </radialGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4D4B0"/>
      <stop offset="100%" stop-color="#E8B98C"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="100%" stop-color="#44403C"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5ACF0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A5ACF0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g opacity="0.3" fill="#FAFAF9">
    <circle cx="60" cy="80" r="2"/>
    <circle cx="340" cy="120" r="2"/>
    <circle cx="80" cy="320" r="2"/>
    <circle cx="320" cy="300" r="2"/>
    <circle cx="200" cy="40" r="1.5"/>
    <circle cx="50" cy="200" r="1.5"/>
    <circle cx="350" cy="200" r="1.5"/>
  </g>

  <!-- Body / shoulders -->
  <path d="M 80 400 Q 80 280 200 270 Q 320 280 320 400 Z" fill="url(#shirt)"/>
  <!-- Shirt collar -->
  <path d="M 160 280 Q 200 310 240 280 L 235 295 Q 200 320 165 295 Z" fill="#F4D4B0" opacity="0.95"/>

  <!-- Neck -->
  <path d="M 175 250 Q 175 285 200 285 Q 225 285 225 250 Z" fill="url(#face)"/>

  <!-- Face -->
  <ellipse cx="200" cy="190" rx="68" ry="78" fill="url(#face)"/>

  <!-- Hair -->
  <path d="M 132 175 Q 130 110 200 105 Q 270 110 268 175 Q 268 145 250 140 Q 245 130 200 128 Q 165 130 160 140 Q 138 145 132 175 Z" fill="url(#hair)"/>
  <!-- Hair side -->
  <path d="M 132 175 Q 128 210 138 230 L 148 215 Q 142 195 145 175 Z" fill="url(#hair)"/>
  <path d="M 268 175 Q 272 210 262 230 L 252 215 Q 258 195 255 175 Z" fill="url(#hair)"/>

  <!-- Eyebrows -->
  <path d="M 168 175 Q 180 170 192 175" stroke="#1C1917" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 208 175 Q 220 170 232 175" stroke="#1C1917" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="180" cy="195" rx="4" ry="5" fill="#1C1917"/>
  <ellipse cx="220" cy="195" rx="4" ry="5" fill="#1C1917"/>
  <circle cx="181" cy="193" r="1.2" fill="#F4F4F5"/>
  <circle cx="221" cy="193" r="1.2" fill="#F4F4F5"/>

  <!-- Nose -->
  <path d="M 200 205 Q 198 220 200 225 Q 204 222 202 218" stroke="#A87856" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M 188 240 Q 200 248 212 240" stroke="#A87856" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 188 240 Q 200 235 212 240" fill="#C2453C" opacity="0.4"/>

  <!-- Cheek blush -->
  <ellipse cx="165" cy="218" rx="8" ry="4" fill="#F87171" opacity="0.2"/>
  <ellipse cx="235" cy="218" rx="8" ry="4" fill="#F87171" opacity="0.2"/>

  <!-- Glasses (optional stylish) -->
  <g stroke="#1C1917" stroke-width="2" fill="none" opacity="0.85">
    <rect x="160" y="183" width="35" height="22" rx="6"/>
    <rect x="205" y="183" width="35" height="22" rx="6"/>
    <line x1="195" y1="194" x2="205" y2="194"/>
  </g>
</svg>
